{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
  <div style="text-align:center;margin-bottom:20px;padding-top:4px">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="code-sphere"
         style="width:72%;max-width:280px;display:block;margin:0 auto">
  </div>

  <form method="post" action="{{ url_for('login') }}" autocomplete="off">
    <label for="usuario">Usuário</label>
    <input type="text" id="usuario" name="usuario" required autofocus
           placeholder="ex: aluno01" pattern="aluno[0-9]{2}"
           title="Use o formato alunoXX (ex: aluno01)">

    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" required>

    <button type="submit" style="width:100%;margin-top:22px">Entrar</button>
  </form>

  <p class="muted" style="margin-top:28px;font-size:13px;text-align:center">
    Esqueceu a senha? Fale com o professor.
  </p>
{% endblock %}
