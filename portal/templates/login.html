{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
  <style>
    @property --giro{syntax:'<angle>';initial-value:0deg;inherits:false}
    .brilho{opacity:1!important;font-weight:600;padding:5px 12px;margin:-8px -4px;border-radius:999px;
      border:3px solid transparent;
      background:linear-gradient(#fff,#fff) padding-box,
        conic-gradient(from var(--giro),#ff004c,#ff9d00,#ffe600,#2bd94f,#00c8ff,#5b5bff,#d400ff,#ff004c) border-box;
      box-shadow:0 0 12px rgba(212,0,255,.35);animation:giro 2.5s linear infinite}
    @keyframes giro{to{--giro:360deg}}
    @media (prefers-reduced-motion:reduce){.brilho{animation:none}}
  </style>
  <div style="text-align:center;margin-bottom:20px;padding-top:4px">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="code-sphere"
         style="width:72%;max-width:280px;display:block;margin:0 auto">
  </div>

  <form method="post" action="{{ url_for('login') }}" autocomplete="off">
    <label for="usuario">Usuário</label>
    <input type="text" id="usuario" name="usuario" required autofocus
           placeholder="ex: aluno01" pattern="aluno[0-9]{2}"
           title="Use o formato alunoXX (ex: aluno01)">

    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" required>

    <button type="submit" style="width:100%;margin-top:22px">Entrar</button>
  </form>

  <p class="muted" style="margin-top:28px;font-size:13px;text-align:center">
    Esqueceu a senha? Fale com o professor.
  </p>

  <p style="text-align:center;margin-top:20px;display:flex;justify-content:center;gap:16px">
    <a href="{{ url_for('changelog') }}"
       {% if versao_atual == "1.1.0" %}class="brilho"{% endif %}
       style="font-size:12px;color:var(--magenta);text-decoration:none;opacity:.7">
      Versão {{ versao_atual }} — Changelog
    </a>
    <span style="font-size:12px;color:#d1d5db">·</span>
    <a href="{{ url_for('about') }}"
       style="font-size:12px;color:var(--magenta);text-decoration:none;opacity:.7">
      Sobre
    </a>
  </p>
{% endblock %}
